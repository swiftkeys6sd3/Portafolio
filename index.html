    <style>

    <!-- Intenta cargar el PDF directamente -->

            <p>Tu navegador móvil no puede previsualizar el archivo directamente.</p>
            <a href="Portafolio Arquitectura Esteban Reyes.pdf" target="_blank">Abrir Portafolio PDF</a>
